<style>

/* =========================================================
   VARIABLES
========================================================= */

:root {
    --black: #1C1A1A;
    --grey: #A6A6A6;
    --light: #e7e7e7;
    --red: #C43C2F;
    --white: #fff;

    --font-primary: 'Space Grotesk', Arial, sans-serif;
    --font-secondary: Inter, Arial, sans-serif;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    background: var(--white);
    color: var(--black);
    overflow-x: hidden;
    font-family: var(--font-secondary);
}


/* =========================================================
   HERO
========================================================= */

.portfolio-hero {
    min-height: 100svh;

    width: 90%;
    max-width: 1400px;

    margin: auto;

    display: grid;

    grid-template-columns:
        minmax(0, .85fr)
        minmax(0, 1.15fr);

    gap: clamp(1.5rem, 4vw, 4rem);

    align-items: center;

    padding: 4rem 0;
}


/* =========================================================
   LEFT CONTENT
========================================================= */

.hero-content {
    position: relative;
    z-index: 5;
}

.kicker {
    font-size: 10px;
    font-weight: 600;

    letter-spacing: .18em;

    color: #666;

    margin-bottom: 1.5rem;
}

.kicker::before {
    content: "";

    display: inline-block;

    width: 24px;
    height: 2px;

    background: var(--red);

    vertical-align: middle;

    margin-right: 8px;
}


.hero-content h1 {
    font-family: var(--font-primary);

    font-size:
        clamp(3.2rem, 2.7rem + 3vw, 4.5rem);

    font-weight: 700;

    line-height: .95;

    letter-spacing: -.055em;

    margin: 0 0 1.5rem;
}

.hero-content h1 span {
    color: var(--red);
}


.hero-content p {
    max-width: 34rem;

    font-size:
        clamp(1rem, .95rem + .24vw, 1.125rem);

    line-height: 1.7;

    color: #555;

    margin: 0 0 1.75rem;
}


/* =========================================================
   BUTTON
========================================================= */

.button {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    padding: .85rem 1rem;

    border: 2px solid var(--red);

    background: var(--red);

    color: white;

    text-decoration: none;

    font-weight: 600;

    transition:
        transform .2s,
        box-shadow .2s;
}

.button:hover {
    transform: translate(-2px, -2px);

    box-shadow:
        5px 5px 0 var(--black);
}


/* =========================================================
   VISUAL
========================================================= */

.hero-visual {
    position: relative;

    width: 100%;

    min-width: 0;

    aspect-ratio: 1.18;

    isolation: isolate;
}


/* faint background grid */

.micro-grid {
    position: absolute;

    inset: 7%;

    z-index: -2;

    background-image:
        linear-gradient(#1c1a1a08 1px, transparent 1px),
        linear-gradient(90deg, #1c1a1a08 1px, transparent 1px);

    background-size: 24px 24px;

    mask-image:
        linear-gradient(
            transparent,
            #000 20%,
            #000 80%,
            transparent
        );
}


/* technical scan */

.scan {
    position: absolute;

    left: 5%;
    right: 5%;

    height: 1px;

    top: 10%;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--red),
            transparent
        );

    opacity: .35;

    animation: scan 7s linear infinite;

    z-index: 4;
}


/* =========================================================
   SVG
========================================================= */

.structure {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: visible;
}


/* =========================================================
   TECHNICAL GEOMETRY
========================================================= */

.hud {
    fill: none;

    stroke: #bfc0c0;

    stroke-width: 1;

    opacity: .55;

    stroke-dasharray: 8 8;
}

.hud-solid {
    fill: none;

    stroke: #a9aaaa;

    stroke-width: 1;

    opacity: .45;
}


/* =========================================================
   MAIN STRUCTURE
========================================================= */

.frame {
    fill: none;

    stroke: var(--black);

    stroke-width: 2.2;

    stroke-linejoin: round;

    stroke-linecap: round;

    opacity: .95;

    stroke-dasharray: 1800;

    stroke-dashoffset: 1800;

    animation:
        draw-frame 3s ease-out forwards;
}


/* subtle concrete fills */

.concrete {
    fill: #e8e8e6;

    stroke: var(--black);

    stroke-width: 1.5;

    opacity: .85;
}


/* =========================================================
   REBAR
========================================================= */

.rebar {
    fill: none;

    stroke: var(--red);

    stroke-width: 1.7;

    stroke-linecap: round;

    opacity: 0;

    stroke-dasharray: 1200;

    stroke-dashoffset: 1200;

    animation:
        draw-rebar 3.2s ease-out 1.8s forwards;
}


.rebar-light {
    fill: none;

    stroke: var(--red);

    stroke-width: 1.1;

    opacity: 0;

    animation:
        fade-rebar 1s ease 2.5s forwards;
}


/* =========================================================
   CALLOUTS
========================================================= */

.callout {
    fill: none;

    stroke: var(--red);

    stroke-width: 1.5;

    stroke-linecap: round;

    stroke-linejoin: round;

    stroke-dasharray: 300;

    stroke-dashoffset: 300;

    animation:
        draw-callout 1.2s ease-out forwards;
}

.callout-1 {
    animation-delay: 3.1s;
}

.callout-2 {
    animation-delay: 3.4s;
}

.callout-3 {
    animation-delay: 3.7s;
}

.callout-4 {
    animation-delay: 4s;
}


.node {
    fill: white;

    stroke: var(--red);

    stroke-width: 2;

    opacity: 0;

    animation:
        node-in .5s ease forwards;
}

.node-1 {
    animation-delay: 3.5s;
}

.node-2 {
    animation-delay: 3.8s;
}

.node-3 {
    animation-delay: 4.1s;
}

.node-4 {
    animation-delay: 4.4s;
}


/* =========================================================
   CODE PANEL
========================================================= */

.code-panel {
    fill: white;

    stroke: var(--black);

    stroke-width: 1.5;

    opacity: 0;

    animation:
        panel-in .8s ease 2.8s forwards;
}


.code-line {
    stroke: #777;

    stroke-width: 2;

    opacity: 0;

    animation:
        code-in .4s ease forwards;
}

.code-line.red {
    stroke: var(--red);
}

.code-line:nth-child(1) {
    animation-delay: 3.2s;
}

.code-line:nth-child(2) {
    animation-delay: 3.35s;
}

.code-line:nth-child(3) {
    animation-delay: 3.5s;
}

.code-line:nth-child(4) {
    animation-delay: 3.65s;
}

.code-line:nth-child(5) {
    animation-delay: 3.8s;
}


/* =========================================================
   FLOATING DETAILS
========================================================= */

.floating {
    animation:
        float 6s ease-in-out infinite;
}

.floating-slow {
    animation:
        float 8s ease-in-out 1s infinite;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes draw-frame {

    to {
        stroke-dashoffset: 0;
    }

}


@keyframes draw-rebar {

    to {
        opacity: 1;

        stroke-dashoffset: 0;
    }

}


@keyframes fade-rebar {

    to {
        opacity: .9;
    }

}


@keyframes draw-callout {

    to {
        stroke-dashoffset: 0;
    }

}


@keyframes node-in {

    from {
        opacity: 0;

        transform:
            scale(.4);
    }

    to {
        opacity: 1;

        transform:
            scale(1);
    }

}


@keyframes panel-in {

    from {
        opacity: 0;

        transform:
            translateY(10px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }

}


@keyframes code-in {

    from {
        opacity: 0;

        transform:
            translateX(-8px);
    }

    to {
        opacity: .8;

        transform:
            translateX(0);
    }

}


@keyframes float {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-6px);
    }

}


@keyframes scan {

    0% {
        top: 10%;
        opacity: 0;
    }

    15% {
        opacity: .35;
    }

    85% {
        opacity: .35;
    }

    100% {
        top: 90%;
        opacity: 0;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 900px) {

    .portfolio-hero {

        grid-template-columns: 1fr;
        grid-template-rows: 40% 1fr;

        min-height: auto;

        padding:
            5rem 0 3rem;
    }

    .hero-content {
        max-width: 650px;
        order: 1;
    }

    .hero-visual {
        max-width: 760px;
        margin: auto;
    }

}


@media (max-width: 520px) {

    .portfolio-hero {
        width: 92%;
    }

    .hero-content h1 {
        font-size: 3rem;
    }

    .hero-visual {
        aspect-ratio: 1;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;

        animation-iteration-count:
            1 !important;
    }

}


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog Article | Hammond Web Solutions</title>

    <meta
        name="description"
        content="Read the latest articles from Hammond Web Solutions."
    >

    <link rel="stylesheet" href="/assets/css/global.css">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/blog-article.css">
</head>

<body>

    <div id="header"></div>

    <main id="blog-article-page">

        

        <article id="blog-article">
            

            <figure
                id="blog-article-image-wrap"
                class="article-image-wrap"
                hidden
            >
                <img id="blog-article-image" src="" alt="">
            </figure>

            <div
                id="blog-article-body"
                class="article-body"
            >
                <p>Loading article content...</p>
            </div>

            

        </article>

        <div
            id="blog-article-message"
            class="article-message"
            role="status"
            aria-live="polite"
            hidden
        ></div>

    </main>

    <div id="footer"></div>

    <script src="/assets/js/components.js"></script>
    <script src="/assets/js/script.js"></script>
    <script src="/assets/js/blog-article.js"></script>

</body>

</html>
